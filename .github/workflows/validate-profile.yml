name: Validate profile README

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assets are up to date with the generator
        run: |
          python3 scripts/build_assets.py
          git diff --exit-code -- assets/

      - name: README and assets are consistent
        run: python3 scripts/check_profile.py
