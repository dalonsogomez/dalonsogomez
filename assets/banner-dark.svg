      @keyframes caret0 { 0%,0.0% {transform:translateX(0)} 13.333%,28.333% {transform:translateX(478.8px)} 31.667%,100% {transform:translateX(0)} }
      @keyframes show0 { 0%,0.0% {opacity:0} 0.01%,31.667% {opacity:1} 31.677000000000003%,100% {opacity:0} }
      .clip0 { transform-box:fill-box; transform-origin:0 0; animation:type0 13.5s steps(42,end) infinite; }
      .caret0 { animation:caret0 13.5s steps(42,end) infinite; }
      .line0 { animation:show0 13.5s linear infinite; }
      @keyframes type1 { 0%,33.333% {transform:scaleX(0)} 46.666%,61.666% {transform:scaleX(1)} 65.0%,100% {transform:scaleX(0)} }
