      @keyframes show1 { 0%,33.333% {opacity:0} 33.342999999999996%,65.0% {opacity:1} 65.01%,100% {opacity:0} }
      .clip1 { transform-box:fill-box; transform-origin:0 0; animation:type1 13.5s steps(41,end) infinite; }
      .caret1 { animation:caret1 13.5s steps(41,end) infinite; }
      .line1 { animation:show1 13.5s linear infinite; }
      @keyframes type2 { 0%,66.667% {transform:scaleX(0)} 80.0%,95.0% {transform:scaleX(1)} 98.334%,100% {transform:scaleX(0)} }
      @keyframes caret2 { 0%,66.667% {transform:translateX(0)} 80.0%,95.0% {transform:translateX(467.4px)} 98.334%,100% {transform:translateX(0)} }
      @keyframes show2 { 0%,66.667% {opacity:0} 66.677%,98.334% {opacity:1} 98.34400000000001%,100% {opacity:0} }
      .clip2 { transform-box:fill-box; transform-origin:0 0; animation:type2 13.5s steps(41,end) infinite; }
      .caret2 { animation:caret2 13.5s steps(41,end) infinite; }
      .line2 { animation:show2 13.5s linear infinite; }
      @keyframes blink { 50% {opacity:0} }
      .blink { animation: blink 1s step-end infinite; }
      @media (prefers-reduced-motion: reduce) {
        .clip0, .caret0, .line0, .blink, .flow, .halo { animation: none !important; }
        .line1, .line2 { display: none; }
