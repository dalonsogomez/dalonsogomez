    <style>
      .flow { stroke:#36BCF7; stroke-opacity:.45; stroke-width:1.4; stroke-dasharray:4 7; animation: flow 2.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-22; } }
