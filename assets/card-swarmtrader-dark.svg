<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 194" width="1060" height="194" role="img" aria-labelledby="title desc">
  <title id="title">swarmtrader</title>
  <desc id="desc">Multi-agent equity research you can audit: walk-forward evaluation, out-of-sample probability calibration and statistical controls for backtest overfitting. When the evidence is not there, it abstains instead of pretending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0A1C27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#7C6CF2"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1F2A33"/>
    </pattern></defs>
  <rect x="1" y="1" width="1058" height="192" rx="14" fill="url(#bg)" stroke="#30363D"/>
  <rect x="1" y="24" width="4" height="146" rx="2" fill="url(#accent)"/>
  <circle cx="38" cy="44" r="6" fill="none" stroke="#36BCF7" stroke-width="2"/>
  <circle cx="38" cy="44" r="2.2" fill="#36BCF7"/>
  <text x="54" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#F0F6FC">swarmtrader</text>
  <rect x="193.4" y="33" width="80.8" height="22" rx="11" fill="url(#accent)"/><text x="233.8" y="48.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1" fill="#FFFFFF">FLAGSHIP</text>
  <text x="1028" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B949E">dalonsogomez-ai/swarmtrader</text>
  <text x="32" y="82" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C9D1D9">Multi-agent equity research you can audit: walk-forward evaluation, out-of-sample probability calibration and statistical</text><text x="32" y="103" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C9D1D9">controls for backtest overfitting. When the evidence is not there, it abstains instead of pretending.</text>
  <rect x="32.0" y="150" width="64.6" height="24" rx="12" fill="#0F2A38" stroke="#36BCF7" stroke-opacity=".35"/><text x="64.3" y="166.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#36BCF7">Python</text><rect x="104.6" y="150" width="100.1" height="24" rx="12" fill="#0F2A38" stroke="#36BCF7" stroke-opacity=".35"/><text x="154.6" y="166.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#36BCF7">Multi-agent</text><rect x="212.7" y="150" width="100.1" height="24" rx="12" fill="#0F2A38" stroke="#36BCF7" stroke-opacity=".35"/><text x="262.8" y="166.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#36BCF7">Calibration</text><rect x="320.8" y="150" width="121.4" height="24" rx="12" fill="#0F2A38" stroke="#36BCF7" stroke-opacity=".35"/><text x="381.5" y="166.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#36BCF7">CI + 277 tests</text><rect x="450.2" y="150" width="43.3" height="24" rx="12" fill="#0F2A38" stroke="#36BCF7" stroke-opacity=".35"/><text x="471.8" y="166.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#36BCF7">MIT</text>
