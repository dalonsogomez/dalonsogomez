<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Alonso Gomez GitHub profile banner</title>
  <desc id="desc">Animated dark technical banner for AI, cybersecurity and automation work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="accent" x1="125" y1="56" x2="1080" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .grid { stroke: #1f2a44; stroke-width: 1; opacity: .52; }
      .headline { font: 700 54px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f0f6fc; letter-spacing: 0; }
      .subtitle { font: 500 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8b949e; letter-spacing: 0; }
      .mono { font: 600 18px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #c9d1d9; letter-spacing: 0; }
      .muted { fill: #6e7681; }
      .blue { fill: #58a6ff; }
      .green { fill: #3fb950; }
      .purple { fill: #a371f7; }
      .line { stroke: url(#accent); stroke-width: 2; opacity: .8; stroke-dasharray: 10 16; animation: flow 12s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .16; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity=".55">
    <path class="grid" d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path class="grid" d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360"/>
  </g>

  <path class="line" d="M92 264C210 135 307 314 418 177C531 38 640 116 737 164C862 226 952 74 1112 126"/>
  <circle class="pulse" cx="92" cy="264" r="7" fill="#58a6ff" filter="url(#glow)"/>
  <circle class="pulse2" cx="418" cy="177" r="8" fill="#3fb950" filter="url(#glow)"/>
  <circle class="pulse" cx="737" cy="164" r="7" fill="#a371f7" filter="url(#glow)"/>
  <circle class="pulse2" cx="1112" cy="126" r="8" fill="#58a6ff" filter="url(#glow)"/>

  <g class="float">
    <rect x="780" y="70" width="320" height="212" rx="18" fill="#0d1117" stroke="#30363d"/>
    <rect x="806" y="96" width="268" height="24" rx="8" fill="#161b22"/>
    <circle cx="824" cy="108" r="5" fill="#f85149"/>
    <circle cx="842" cy="108" r="5" fill="#d29922"/>
    <circle cx="860" cy="108" r="5" fill="#3fb950"/>
    <text x="806" y="154" class="mono"><tspan class="muted">const</tspan> focus = [</text>
    <text x="832" y="185" class="mono"><tspan class="blue">"AI"</tspan>, <tspan class="green">"security"</tspan>,</text>
    <text x="832" y="216" class="mono"><tspan class="purple">"automation"</tspan></text>
    <text x="806" y="247" class="mono">].ship()<tspan class="blink">_</tspan></text>
  </g>

  <g>
    <rect x="90" y="78" width="104" height="104" rx="24" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
    <path d="M123 132L143 112L163 132L143 152L123 132Z" fill="#58a6ff" opacity=".9"/>
    <path d="M143 92V112M143 152V172M103 132H123M163 132H183" stroke="#3fb950" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="220" y="118" class="subtitle">AI x Cybersecurity x Automation</text>
  <text x="220" y="185" class="headline">Daniel Alonso Gomez</text>
  <text x="220" y="232" class="subtitle">Computer Engineer building practical systems, agents and developer workflows.</text>

  <g transform="translate(220 268)">
    <rect width="132" height="34" rx="17" fill="#13233a" stroke="#254c7a"/>
    <text x="22" y="23" class="mono" font-size="15">Python</text>
    <rect x="146" width="152" height="34" rx="17" fill="#112b1d" stroke="#1f6b37"/>
    <text x="168" y="23" class="mono" font-size="15">TypeScript</text>
    <rect x="312" width="126" height="34" rx="17" fill="#281c3d" stroke="#6e40c9"/>
    <text x="334" y="23" class="mono" font-size="15">Agents</text>
    <rect x="452" width="150" height="34" rx="17" fill="#351d1b" stroke="#8e2f2a"/>
    <text x="474" y="23" class="mono" font-size="15">Security</text>
  </g>
</svg>
